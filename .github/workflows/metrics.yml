name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =========================
      # MAIN PROFILE
      # =========================

      - name: Main Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: header, metadata
          plugin_introduction: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 0
          plugin_languages_threshold: 0%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics.svg

      # =========================
      # ISOMETRIC COMMIT CALENDAR (TODOS LOS AÑOS)
      # =========================

      - name: Isometric Calendar
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-isocalendar.svg

      # =========================
      # COMMIT CALENDAR (TODOS LOS AÑOS)
      # =========================

      - name: Commit Calendar
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-calendar.svg


      # =========================
      # STARRED TOPICS (TODOS SIN LIMITE)
      # =========================
      - name: Starred Topics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: SergiusYT
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 20  # 👈 CAMBIA DE 0 A 20 (máximo permitido)
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          output_action: repository
          filename: github-metrics-topics-icons.svg

      # =========================
      # STARGAZERS WITH WORLDMAP
      # =========================

      - name: Stargazers Worldmap
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_days: 0
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: graph
          plugin_stargazers_worldmap: yes
          plugin_stargazers_worldmap_token: ${{ secrets.GOOGLE_MAP_TOKEN }}
          plugin_stargazers_worldmap_sample: 200
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-stargazers.svg

      # =========================
      # CODING HABITS AND ACTIVITY
      # =========================

      - name: Coding Habits
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic  # 👈 CAMBIA de 'graph' a 'classic' (no requiere d3)
          plugin_habits_trim: yes
          plugin_habits_languages_limit: 8    # 👈 CAMBIA de 0 a 8 (máximo)
          plugin_habits_languages_threshold: 0%
          config_timezone: America/Bogota
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-habits.svg

      # =========================
      # COMMUNITY (SIN LIMITES)
      # =========================

      - name: Community Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_people: yes
          plugin_people_limit: 0
          plugin_reactions: yes
          plugin_reactions_limit: 0
          plugin_stars: yes
          plugin_stars_limit: 0
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-community.svg

      # =========================
      # TRAFFIC
      # =========================

      - name: Traffic Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: repositories
          repositories_affiliations: owner
          plugin_traffic: yes
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-traffic.svg
          
      # =========================
      # STEAM
      # =========================

      - name: Steam Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199188649506"
          config_display: large
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-steam.svg
