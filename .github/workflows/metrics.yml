name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =========================
      # 1. MAIN PROFILE
      # =========================

      - name: Main Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: header, metadata
          plugin_introduction: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 0
          plugin_languages_threshold: 0%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics.svg

      # =========================
      # 2. COMMIT CALENDAR
      # =========================

      - name: Commit Calendar
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-calendar.svg

      # =========================
      # 3. STARRED TOPICS
      # =========================

      - name: Starred Topics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 20
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-topics.svg

      # =========================
      # 4. STARGAZERS WITH WORLDMAP
      # =========================

      - name: Stargazers Worldmap
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_days: 0
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: graph
          plugin_stargazers_worldmap: yes
          plugin_stargazers_worldmap_token: ${{ secrets.GOOGLE_MAP_TOKEN }}
          plugin_stargazers_worldmap_sample: 200
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-stargazers.svg

      # =========================
      # 5. COMMUNITY
      # =========================

      - name: Community Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_people: yes
          plugin_people_limit: 0
          plugin_reactions: yes
          plugin_reactions_limit: 0
          plugin_stars: yes
          plugin_stars_limit: 0
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-community.svg

      # =========================
      # 6. TRAFFIC
      # =========================

      - name: Traffic Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: repositories
          repositories_affiliations: owner
          plugin_traffic: yes
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-traffic.svg

      # =========================
      # 7. STEAM
      # =========================

      - name: Steam Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199188649506"
          config_display: large
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-steam.svg

      # =========================
      # 8. TERMINAL METRICS
      # =========================

      - name: Terminal Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: header, metadata
          filename: github-metrics-terminal.svg
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed

      # =========================
      # 9. NOTABLE CONTRIBUTIONS
      # =========================

      - name: Notable Contributions
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_notable: yes
          plugin_notable_filter: repo:*
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-notable.svg

      # =========================
      # 10. LINES OF CODE CHANGED
      # =========================

      - name: Lines of Code
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_lines: yes
          plugin_lines_sections: base
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-lines.svg

      # =========================
      # 11. CODING HABITS (RACHAS Y ACTIVIDAD)
      # =========================

      - name: Coding Habits
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 365
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes
          config_timezone: America/Bogota
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-habits.svg

      # =========================
      # 12. REPOSITORY CONTRIBUTORS
      # =========================

      - name: Repository Contributors
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_contributors: yes
          plugin_contributors_base: repositories
          plugin_contributors_head: repositories
          plugin_contributors_contributions: yes
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-contributors.svg

      # =========================
      # 13. FOLLOW-UP (ISSUES Y PULL REQUESTS)
      # =========================

      - name: Follow-up
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-followup.svg
