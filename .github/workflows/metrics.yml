name: Metrics

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

jobs:
github-metrics:
runs-on: ubuntu-latest


permissions:
  contents: write

steps:

  # =========================
  # PRINCIPAL
  # =========================
  - name: Main Metrics
    uses: lowlighter/metrics@latest
    with:
      token: ${{ secrets.METRICS_TOKEN }}
      user: SergiusYT

      template: classic
      base: header, activity, community, repositories, metadata

      plugin_languages: yes
      plugin_languages_indepth: yes
      plugin_languages_limit: 8

      plugin_isocalendar: yes
      plugin_isocalendar_duration: full-year

      output_action: gist
      committer_gist: ec42699864e81e440664927180da66ed
      filename: github-metrics.svg

  # =========================
  # DESARROLLO
  # =========================
  - name: Development Metrics
    uses: lowlighter/metrics@latest
    with:
      token: ${{ secrets.METRICS_TOKEN }}
      user: SergiusYT

      template: classic
      base: ""

      plugin_habits: yes
      plugin_habits_facts: yes
      plugin_habits_charts: yes

      plugin_activity: yes
      plugin_activity_limit: 15
      plugin_activity_days: 30

      plugin_lines: yes

      output_action: gist
      committer_gist: ec42699864e81e440664927180da66ed
      filename: github-metrics-dev.svg

  # =========================
  # PROYECTOS
  # =========================
  - name: Projects Metrics
    uses: lowlighter/metrics@latest
    with:
      token: ${{ secrets.METRICS_TOKEN }}
      user: SergiusYT

      template: classic
      base: ""

      plugin_repositories: yes
      plugin_repositories_featured: 6

      plugin_achievements: yes
      plugin_achievements_threshold: C

      plugin_notable: yes

      output_action: gist
      committer_gist: ec42699864e81e440664927180da66ed
      filename: github-metrics-projects.svg

  # =========================
  # COMUNIDAD
  # =========================
  - name: Community Metrics
    uses: lowlighter/metrics@latest
    with:
      token: ${{ secrets.METRICS_TOKEN }}
      user: SergiusYT

      template: classic
      base: ""

      plugin_topics: yes
      plugin_topics_mode: icons
      plugin_topics_limit: 24

      plugin_stars: yes
      plugin_stars_limit: 8

      plugin_people: yes

      plugin_reactions: yes

      output_action: gist
      committer_gist: ec42699864e81e440664927180da66ed
      filename: github-metrics-community.svg

