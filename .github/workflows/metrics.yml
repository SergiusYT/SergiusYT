name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =========================
      # MAIN PROFILE
      # =========================

      - name: Main Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: header, metadata
          plugin_introduction: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics.svg

      # =========================
      # ACTIVITY & CALENDAR (CORREGIDO - usando master)
      # =========================

      - name: Activity Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 15
          plugin_activity_load: 300
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_timestamps: false
          plugin_activity_filter: push,issue,pr,release,fork,review,create,delete,comment,wiki,star,member,public
          plugin_calendar: yes
          plugin_lines: yes
          plugin_lines_sections: base
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-activity.svg

      # =========================
      # COMMUNITY
      # =========================

      - name: Community Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 24
          plugin_stars: yes
          plugin_stars_limit: 8
          plugin_people: yes
          plugin_reactions: yes
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-community.svg

      # =========================
      # GITHUB STATS
      # =========================

      - name: GitHub Stats
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_stargazers: yes
          plugin_followup: yes
          plugin_followup_sections: repositories
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-stats.svg

      # =========================
      # TRAFFIC (SKYLINE DESHABILITADO - timeout issues)
      # =========================

      - name: Traffic Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_traffic: yes
          # plugin_skyline: yes  # COMENTADO - causa timeout
          # plugin_skyline_year: 2025
          # plugin_skyline_frames: 60
          # plugin_skyline_quality: 0.5
          # plugin_skyline_compatibility: true
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-traffic.svg

      # =========================
      # STEAM (FUNCIONANDO)
      # =========================

      - name: Steam Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: classic
          base: ""
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199188649506"
          config_display: large
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: github-metrics-steam.svg
