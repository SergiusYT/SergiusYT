name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =========================
      # TERMINAL TEMPLATE - MAIN
      # =========================

      - name: Terminal Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: header, metadata
          filename: metrics.terminal.svg
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed

      # =========================
      # ISOMETRIC CALENDAR (IMPRESIONANTE)
      # =========================

      - name: Isometric Calendar
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: metrics.isocalendar.svg

      # =========================
      # LANGUAGES ACTIVITY (CON DETALLES)
      # =========================

      - name: Languages Activity
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: lines,percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: metrics.languages.svg

      # =========================
      # STARRED TOPICS (INTERESANTES)
      # =========================

      - name: Starred Topics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 15
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: metrics.topics.svg

      # =========================
      # STARGAZERS (MUESTRA POPULARIDAD)
      # =========================

      - name: Stargazers
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_days: 14
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: graph
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: metrics.stargazers.svg

      # =========================
      # LINES OF CODE CHANGED (MUESTRA ACTIVIDAD)
      # =========================

      - name: Lines of Code
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: ""
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: metrics.lines.svg

      # =========================
      # ACHIEVEMENTS (LOGROS DESTACADOS)
      # =========================

      - name: Achievements
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: B
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: metrics.achievements.svg

      # =========================
      # FOLLOW UP (ISSUES Y PULL REQUESTS)
      # =========================

      - name: Follow Up
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: metrics.followup.svg

      # =========================
      # REPOSITORY TRAFFIC (VISITAS)
      # =========================

      - name: Repository Traffic
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: repositories
          repositories_affiliations: owner
          plugin_traffic: yes
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: metrics.traffic.svg

      # =========================
      # STEAM (TOQUE PERSONAL)
      # =========================

      - name: Steam Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SergiusYT
          template: terminal
          base: ""
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199188649506"
          config_display: large
          output_action: gist
          committer_gist: ec42699864e81e440664927180da66ed
          filename: metrics.steam.svg
